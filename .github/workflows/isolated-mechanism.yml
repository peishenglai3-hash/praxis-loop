name: Isolated mechanism tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism:
    # GitHub-hosted standard runners provision a fresh VM for each job.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run mechanism suite in networkless container
        run: bash scripts/run-linux-isolated.sh

      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praxis-loop-mechanism-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-artifacts/linux-isolated/
          if-no-files-found: warn
          retention-days: 14